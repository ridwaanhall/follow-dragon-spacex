<!-- main.html -->
<!DOCTYPE html>
{% load static %}
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
        <title>{% block title %}Track SpaceX Dragon & ISS in Real-Time{% endblock %} | Follow Dragon</title>
    
        <!-- SEO Meta Tags -->
        <meta name="description" content="Track the SpaceX Dragon spacecraft and the ISS in real-time. Live tracking is only active during Dragon launch events." />
        <meta name="keywords" content="SpaceX Dragon tracker, ISS tracking, real-time spacecraft location, Dragon launch, space station, orbital tracking" />
        <meta name="author" content="Follow Dragon Team" />
        <meta name="editor" content="ridwaanhall" />
        <meta name="robots" content="index, follow" />
    
        <!-- Canonical URL -->
        <link rel="canonical" href="{{ request.scheme }}://{{ request.get_host }}/" />
    
        <!-- Open Graph Meta Tags (Facebook & LinkedIn) -->
        <meta property="og:title" content="Track SpaceX Dragon & ISS in Real-Time | Follow Dragon" />
        <meta property="og:description" content="Live tracking of SpaceX Dragon and the ISS, active only during Dragon launch events." />
        <meta property="og:image" content="{% static 'images/dragon_tracking_preview.jpg' %}" />
        <meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}/" />
        <meta property="og:type" content="website" />
    
        <!-- Twitter Card Meta Tags -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Track SpaceX Dragon & ISS in Real-Time | Follow Dragon" />
        <meta name="twitter:description" content="Live tracking of SpaceX Dragon and the ISS, available during Dragon launch events." />
        <meta name="twitter:image" content="{% static 'images/dragon_tracking_twitter.jpg' %}" />
    
        <!-- Structured Data for SEO (JSON-LD) -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Website",
            "name": "Follow Dragon",
            "url": "{{ request.scheme }}://{{ request.get_host }}/",
            "description": "Track SpaceX Dragon and the ISS in real-time. Live tracking is only available during SpaceX Dragon launch events.",
            "publisher": {
                "@type": "Organization",
                "name": "Follow Dragon Team",
                "logo": "{{ request.scheme }}://{{ request.get_host }}{% static 'images/logo.png' %}"
            },
            "editor": {
                "@type": "Person",
                "name": "ridwaanhall"
            },
            "event": {
                "@type": "LaunchEvent",
                "name": "SpaceX Dragon Launch Tracking",
                "startDate": "TBA",
                "eventStatus": "https://schema.org/EventScheduled",
                "location": {
                    "@type": "Place",
                    "name": "Earth Orbit",
                    "geo": {
                        "@type": "GeoCoordinates",
                        "latitude": "TBA",
                        "longitude": "TBA"
                    }
                }
            }
        }
        </script>
    
        <!-- Stylesheets -->
        <link rel="stylesheet" href="{% static 'follow-dragon/css/normalize.min.css' %}" />
        <link rel="stylesheet" href="{% static 'follow-dragon/css/layout.css' %}" />
        <link rel="stylesheet" href="{% static 'style.min.css' %}" />
        <link rel="stylesheet" href="{% static 'follow-dragon/css/ab.css' %}" />
    
        <!-- Favicon -->
        <link rel="icon" href="{% static 'favicon/favicon.ico' %}" type="image/x-icon">
    
        <!-- Additional Scripts or Meta Tags for Individual Pages -->
        {% block head_scripts %}{% endblock %}
    </head>
       
    <body>
        <!-- Content to be overridden by child templates -->
        {% block content %}
        {% endblock %}

        <!-- Common Scripts -->
        <script type="text/javascript" src="{% static 'follow-dragon/js/three/three.min.js' %}"></script>
        <script type="text/javascript" src="{% static 'follow-dragon/js/three/WebGL.js' %}"></script>
        <script type="text/javascript" src="{% static 'follow-dragon/js/gsap/gsap.min.js' %}"></script>
        <script type="text/javascript" src="{% static 'follow-dragon/js/gsap/DrawSVGPlugin.min.js' %}"></script>

        <!-- Additional Scripts for individual pages -->
        {% block body_scripts %}
        {% endblock %}
    </body>
</html>
